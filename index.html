
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Earth Globe</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #020713;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#container {
    width: 100%;
    height: 100vh;
    position: relative;
}

canvas {
    display: block;
}

.header {
    position: absolute;
    top: 25px;
    width: 100%;
    text-align: center;
    z-index: 2;
    pointer-events: none;
}

.header h1 {
    color: #8cecff;
    font-size: 25px;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #00aaff;
}

.header p {
    color: #8295aa;
    font-size: 12px;
    margin-top: 10px;
    letter-spacing: 2px;
}

.info {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 3;
}

button {
    background: rgba(0, 30, 55, 0.8);
    color: #70eaff;
    border: 1px solid #00bfff;
    padding: 12px 24px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
    box-shadow: 0 0 15px #008cff33;
    transition: 0.3s;
}

button:hover {
    background: #006c9c;
    box-shadow: 0 0 20px #00bfff;
}

.hint {
    position: absolute;
    bottom: 100px;
    width: 100%;
    text-align: center;
    color: #71869c;
    font-size: 12px;
    pointer-events: none;
}

@media(max-width: 600px) {
    .header h1 {
        font-size: 18px;
        letter-spacing: 2px;
    }

    .header p {
        font-size: 10px;
    }

    button {
        padding: 10px 18px;
        font-size: 12px;
    }

    .hint {
        bottom: 90px;
    }
}
</style>
</head>

<body>

<div id="container">

    <div class="header">
        <h1>3D WORLD GLOBE</h1>
        <p>EXPLORE OUR PLANET</p>
    </div>

    <div class="hint">
        DRAG TO ROTATE • SCROLL TO ZOOM
    </div>

    <div class="info">
        <button id="pauseBtn">Pause Rotation</button>
        <button id="resetBtn">Reset View</button>
    </div>

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import { OrbitControls } from
"three/addons/controls/OrbitControls.js";


// 1. CREATE SCENE

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020713);


// 2. CREATE CAMERA

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0, 6);


// 3. CREATE RENDERER

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;

document.getElementById("container").appendChild(
    renderer.domElement
);


// 4. CREATE LIGHTING

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    1.5
);

scene.add(ambientLight);


const sunlight = new THREE.DirectionalLight(
    0xffffff,
    3
);

sunlight.position.set(5, 3, 5);

scene.add(sunlight);


// 5. LOAD EARTH TEXTURES

const loader = new THREE.TextureLoader();

const earthTexture = loader.load(
    "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
);

const normalTexture = loader.load(
    "https://threejs.org/examples/textures/planets/earth_normal_2048.jpg"
);

const specularTexture = loader.load(
    "https://threejs.org/examples/textures/planets/earth_specular_2048.jpg"
);

const cloudTexture = loader.load(
    "https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
);


// 6. CREATE EARTH

const earthGeometry = new THREE.SphereGeometry(
    2,
    96,
    96
);

const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthTexture,
    normalMap: normalTexture,
    specularMap: specularTexture,
    shininess: 15
});

const earth = new THREE.Mesh(
    earthGeometry,
    earthMaterial
);

scene.add(earth);


// 7. CREATE CLOUD LAYER

const cloudGeometry = new THREE.SphereGeometry(
    2.015,
    96,
    96
);

const cloudMaterial = new THREE.MeshPhongMaterial({
    map: cloudTexture,
    transparent: true,
    opacity: 0.35,
    depthWrite: false
});

const clouds = new THREE.Mesh(
    cloudGeometry,
    cloudMaterial
);

scene.add(clouds);


// 8. CREATE BLUE ATMOSPHERE

const atmosphereGeometry = new THREE.SphereGeometry(
    2.12,
    64,
    64
);

const atmosphereMaterial = new THREE.ShaderMaterial({

    vertexShader: `
        varying vec3 vNormal;

        void main() {

            vNormal = normalize(normalMatrix * normal);

            gl_Position = projectionMatrix *
                modelViewMatrix *
                vec4(position, 1.0);
        }
    `,

    fragmentShader: `
        varying vec3 vNormal;

        void main() {

            float intensity = pow(
                0.75 - dot(vNormal, vec3(0.0, 0.0, 1.0)),
                3.0
            );

            gl_FragColor = vec4(
                0.05,
                0.45,
                1.0,
                intensity
            );
        }
    `,

    blending: THREE.AdditiveBlending,

    side: THREE.BackSide,

    transparent: true
});

const atmosphere = new THREE.Mesh(
    atmosphereGeometry,
    atmosphereMaterial
);

scene.add(atmosphere);


// 9. CREATE STAR FIELD

const starGeometry = new THREE.BufferGeometry();

const starCount = 4000;

const starPositions = [];

for (let i = 0; i < starCount; i++) {

    const x = (Math.random() - 0.5) * 200;

    const y = (Math.random() - 0.5) * 200;

    const z = (Math.random() - 0.5) * 200;

    starPositions.push(x, y, z);

}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial = new THREE.PointsMaterial({
    color: 0x8bcfff,
    size: 0.12,
    transparent: true,
    opacity: 0.8
});

const stars = new THREE.Points(
    starGeometry,
    starMaterial
);

scene.add(stars);


// 10. ORBIT CONTROLS

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.enableZoom = true;

controls.minDistance = 3.5;

controls.maxDistance = 10;

controls.autoRotate = true;

controls.autoRotateSpeed = 0.7;


// 11. SET INITIAL EARTH VIEW

earth.rotation.y = -0.35;

clouds.rotation.y = -0.35;


// 12. PAUSE AND RESUME

const pauseBtn = document.getElementById("pauseBtn");

pauseBtn.addEventListener("click", () => {

    controls.autoRotate = !controls.autoRotate;

    pauseBtn.textContent = controls.autoRotate
        ? "Pause Rotation"
        : "Resume Rotation";

});


// 13. RESET VIEW

document.getElementById("resetBtn").addEventListener(
    "click",
    () => {

        camera.position.set(0, 0, 6);

        earth.rotation.set(0, -0.35, 0);

        clouds.rotation.set(0, -0.35, 0);

        controls.target.set(0, 0, 0);

        controls.update();

    }
);


// 14. ANIMATION LOOP

function animate() {

    requestAnimationFrame(animate);

    // Slowly rotate the cloud layer
    clouds.rotation.y += 0.0003;

    // Update camera controls
    controls.update();

    // Render the 3D scene
    renderer.render(scene, camera);

}

animate();


// 15. RESPONSIVE SCREEN

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

});

</script>

</body>
</html>
