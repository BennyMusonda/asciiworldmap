<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII World Explorer</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --ui-bg: #161b22;
            --ui-border: #30363d;
            --accent: #58a6ff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
        }

        .seed-display {
            font-size: 0.75rem;
            color: #8b949e;
            margin-bottom: 15px;
            word-break: break-all;
            text-align: center;
            max-width: 600px;
        }

        #world-container {
            background-color: #000;
            border: 2px solid var(--ui-border);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: auto;
        }

        #world-map {
            margin: 0;
            white-space: pre;
            line-height: 1.15;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: var(--ui-bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--ui-border);
        }

        .btn-row {
            display: flex;
            gap: 5px;
        }

        button {
            background-color: #21262d;
            color: var(--text-color);
            border: 1px solid var(--ui-border);
            padding: 8px 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.1s ease;
        }

        button:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        button:active {
            background-color: var(--accent);
            color: #000;
        }

        .instructions {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <h1>ASCII WORLD ENGINE</h1>
    <div class="seed-display">Hash Seed: 2caf1d820af51a92dfc24a5d8604ab2e72ab7897</div>

    <div id="world-container">
        <pre id="world-map">Generating map...</pre>
    </div>

    <div class="controls">
        <div class="btn-row">
            <button onclick="move(0, -1)">▲ UP</button>
        </div>
        <div class="btn-row">
            <button onclick="move(-1, 0)">◀ LEFT</button>
            <button onclick="move(0, 0)">⟲ RESET</button>
            <button onclick="move(1, 0)">RIGHT ▶</button>
        </div>
        <div class="btn-row">
            <button onclick="move(0, 1)">▼ DOWN</button>
        </div>
        <div class="instructions">Use WASD, Arrow Keys, or On-Screen buttons to traverse.</div>
    </div>

    <script>
        // Constants for map layout
        const WIDTH = 80;
        const HEIGHT = 35;
        
        // Initial coordinates
        let camX = 1000;
        let camY = 1000;

        // Hash-based custom pseudo-random number generator
        const seedString = "2caf1d820af51a92dfc24a5d8604ab2e72ab7897";
        function getSeedValue(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash);
        }
        const baseSeed = getSeedValue(seedString);

        // Deterministic noise function for procedural generation
        function noise(x, y) {
            let n = Math.sin(x * 12.9898 + y * 78.233 + baseSeed) * 43758.5453123;
            return n - Math.floor(n);
        }

        // Smooth noise over adjacent tiles to simulate natural landscape structures
        function smoothNoise(x, y) {
            let corners = (noise(x-1, y-1) + noise(x+1, y-1) + noise(x-1, y+1) + noise(x+1, y+1)) / 16;
            let sides   = (noise(x-1, y) + noise(x+1, y) + noise(x, y-1) + noise(x, y+1)) / 8;
            let center  = noise(x, y) / 4;
            return corners + sides + center;
        }

        // Map raw noise value into distinct ASCII environment tiles
        function getTile(x, y) {
            // Absolute Center Landmark
            if (x === 1040 && y === 1017) return "[C]";
            if (x === 1041 && y === 1017) return "[P]";
            if (x === 1042 && y === 1017) return "[U]";
            
            // Landscape Generation
            let val = smoothNoise(x, y);

            if (val < 0.38) return "~"; // Deep Ocean
            if (val < 0.44) return "-"; // Shallows / Shoreline
            if (val < 0.65) return "."; // Rolling Plains
            if (val < 0.80) return "'"; // Whispering Forests
            if (val < 0.92) return "#"; // High Peaks
            return "^";                 // Volcanic Spires
        }

        // Render the screen block
        function renderMap() {
            let mapStr = "";
            for (let y = 0; y < HEIGHT; y++) {
                let row = "";
                for (let x = 0; x < WIDTH; x++) {
                    const worldX = camX + x;
                    const worldY = camY + y;
                    
                    // Render player indicator dynamically over map data at center screen
                    if (x === Math.floor(WIDTH / 2) && y === Math.floor(HEIGHT / 2)) {
                        row += "@";
                    } else {
                        row += getTile(worldX, worldY);
                    }
                }
                mapStr += row + "\n";
            }
            document.getElementById("world-map").textContent = mapStr;
        }

        // Camera control interface 
        function move(dx, dy) {
            if (dx === 0 && dy === 0) {
                camX = 1000;
                camY = 1000;
            } else {
                camX += dx * 2;
                camY += dy * 2;
            }
            renderMap();
        }

        // Keyboard bindings
        window.addEventListener("keydown", (e) => {
            switch(e.key.toLowerCase()) {
                case "w": case "arrowup":    move(0, -1); break;
                case "s": case "arrowdown":  move(0, 1);  break;
                case "a": case "arrowleft":  move(-1, 0); break;
                case "d": case "arrowright": move(1, 0);  break;
            }
        });

        // Initialize display
        renderMap();
    </script>
</body>
</html>
